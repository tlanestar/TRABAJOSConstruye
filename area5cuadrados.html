<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="estiloss.css">
    <title>Document</title>
</head>
<body>
    <script>
     let lado;
let area;

for (let i = 1; i <= 5; i++) {

    lado = i * 2;
    area = lado * lado;

    document.write("Cuadrado " + i + "<br>");
    document.write("Lado: " + lado + "<br>");
    document.write("Area: " + area + "<br><br>");
}
    </script>
</body>
</html>
