<body>

    <h1>Datos estudiante</h1>

    <script>
    let nombre= (prompt ("Nombre del  estudiante"));
    let edad=Number (prompt ("Edad"));
    let especialidad= (prompt("especialidad"));
    let direccion=(prompt ("Direccion"));

    document.write("El nombre es:"+nombre+"<br>");
    document.write("Tu edad  es:"+edad+"<br>");  
    document.write("Tu especialidad es:"+especialidad+"<br>");   
    document.write("Tu direccion  es:"+direccion+"<br>");

    
    </script>
    
    
</body>
