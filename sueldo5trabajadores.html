<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloss.css">
    <title>Document</title>
</head>
<body>
    <script>
        let sueldo;
let aumento;
let total;

for (let i = 1; i <= 5; i++) {

    sueldo = 1500 + (i * 200);
    aumento = sueldo * 0.10;
    total = sueldo + aumento;

    document.write("Trabajador " + i + "<br>");
    document.write("Sueldo: $" + sueldo + "<br>");
    document.write("Aumento: $" + aumento + "<br>");
    document.write("Sueldo final: $" + total + "<br><br>");
}
    </script>
</body>
</html>
