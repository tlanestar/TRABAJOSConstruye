<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="estiloss.css"><title>Document</title>
</head>
<body>
    <script>
        let celsius;
let fahrenheit;

document.write("<h2>Conversion de temperatura</h2>");

for (let i = 1; i <= 5; i++) {

    celsius = i * 10;
    fahrenheit = (celsius * 9/5) + 32;

    document.write(celsius + " °C = " + fahrenheit + " °F<br>");
}
    </script>
</body>
</html>
