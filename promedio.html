<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloss.css">
    <title> PROMEDIO</title>
</head>
<body>

    <script>

         let promedio = Number (prompt( 'Escribe tu promedio'));
    let nombre = prompt ('Escribe tu nombre');
    let asignatura = prompt( 'Escribe tu asignatura');
   
       if (promedio>=6){
        document.write ('Aprovaste'+ "<br>")
        document.write ('Tu nombre es:'+ nombre + "<br>")
        document.write ('Tu asignatura es:'+ asignatura + "<br>");
        document.write ('Tu promedio es:'+ promedio + "<br>");
        
       } else { 
        document.write ('Esfuerzate estudia mas:'+ promedio);
        
       }
       


</script>
      
</body>
</html>
