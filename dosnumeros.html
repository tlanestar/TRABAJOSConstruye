<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloss.css">
    <title>numero mayor</title>
</head>
<body>

    <script>

        let numero1= Number (prompt ('Escribe el primer numero'));
        let numero2= Number (prompt ('Escribe el segundo numero'));

        if (numero1>numero2){
            document.write ('El numero mayor es'+ numero1);
        
        } else if (numero2>numero1){
            document.write ('El numero menor es' + numero2);
        }else{
             document.write ('los numeros son iguales');
        }
    </script>
    
</body>
</html>
