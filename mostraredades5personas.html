<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="estiloss.css">
    <title>Document</title>
</head>
<body>
    <script>
        let persona = 1;
let edad;

do {
    edad = 15 + persona;

    document.write("Persona " + persona + "<br>");
    document.write("Edad: " + edad + " años<br><br>");

    persona++;

} while (persona <= 5);
    </script>
</body>
</html>
